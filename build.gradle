// Top-level build file. Android Studio will fill in the right Android
// Gradle Plugin / Kotlin plugin versions the first time you open this
// project (it offers to upgrade automatically if these are out of date).
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}
